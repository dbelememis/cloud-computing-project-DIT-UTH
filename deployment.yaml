apiVersion: apps/v1
kind: Deployment

metadata:
  name: image-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: image-api

  template:
    metadata:
      labels:
        app: image-api

    spec:
      containers:
      - name: image-api
        image: dimitrisbelememis/image-api:v1

        ports:
        - containerPort: 8000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"
